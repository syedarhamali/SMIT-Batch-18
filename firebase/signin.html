<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form id="signin-form">
        <input type="email" name="email" id="signin-email" placeholder="Email" required>
        <input type="password" name="password" id="signin-password" placeholder="Password" required>
        <button type="submit" id="signin-button">SignIn</button>
    </form>

    <button id="logout">Log Out user</button>
    <script type="module" src="signin.js"></script>
    <script type="module" src="firebaseAuth.js"></script>
    <script type="module" src="firebaseconfig.js"></script>
</body>
</html>
